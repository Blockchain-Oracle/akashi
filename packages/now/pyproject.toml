[project]
name = "akashi-now"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "akashi-core",
    "holidays==0.105",
    "rapidfuzz>=3.14.6",
    "tzdata==2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi_now"]

[tool.uv.sources]
akashi-core = { workspace = true }
