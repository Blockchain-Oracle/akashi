# SAGE gateway configuration for the three Akashi services (citation-verify, code-reality-check, live-facts).
# Gateways do NOT read the service card: an operator adds this by hand, or SAGE answers REST requests for these
# services with a 400 before any session lookup. Health checks mirror each card's serving.healthcheck
# (identity + readiness). relay_timeout sits above every service's hard stop (8.5 s / 7 s / 4 s).
# Never add sync_check or sync_allowance: these are not blockchains.
gateway_config:
  services:
    - id: citation-verify
      type: passthrough            # relays and scores; understands no payload semantics
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 30s
    - id: code-reality-check
      type: passthrough            # relays and scores; understands no payload semantics
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 30s
    - id: live-facts
      type: passthrough            # relays and scores; understands no payload semantics
      rpc_types: ["rest"]
      timeout_config:
        relay_timeout: 30s
  active_health_checks:
    local:
      - service_id: citation-verify
        enabled: true
        checks:
          - { name: version, type: rest, method: GET, path: /v1/version, expected_status_code: 200, reputation_signal: critical_error, timeout: 5s }
          - { name: health,  type: rest, method: GET, path: /v1/health,  expected_status_code: 200, reputation_signal: major_error,   timeout: 5s }
      - service_id: code-reality-check
        enabled: true
        checks:
          - { name: version, type: rest, method: GET, path: /v1/version, expected_status_code: 200, reputation_signal: critical_error, timeout: 5s }
          - { name: health,  type: rest, method: GET, path: /v1/health,  expected_status_code: 200, reputation_signal: major_error,   timeout: 5s }
      - service_id: live-facts
        enabled: true
        checks:
          - { name: version, type: rest, method: GET, path: /v1/version, expected_status_code: 200, reputation_signal: critical_error, timeout: 5s }
          - { name: health,  type: rest, method: GET, path: /v1/health,  expected_status_code: 200, reputation_signal: major_error,   timeout: 5s }
