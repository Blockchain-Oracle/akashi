[project]
name = "akashi-workspace"
version = "0.0.0"
description = "Akashi 証 — verification services for Pocket Network's Agentic Portal (uv workspace root)"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["packages/core", "packages/cite", "packages/code", "packages/now", "services/api", "services/nli", "services/worker"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.414",
    "jsonschema>=4.25",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "PLR2004"]  # PLR2004 = no magic numbers
# Brand copy intentionally uses 証, en dashes and the non-breaking hyphen.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# tree-sitter query DSL strings read best on one line each
"packages/code/src/akashi_code/snippet/extract_*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["akashi_core", "akashi_cite", "akashi_code", "akashi_now", "akashi_api", "akashi_nli", "akashi_worker"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# packages/brand/scripts runs standalone with `uv run --with fonttools` (not a workspace member); the JS
# workspace is not Python either.
exclude = ["**/node_modules", "**/.venv", "**/__pycache__", "packages/brand/scripts", "apps"]
