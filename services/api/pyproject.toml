[project]
name = "akashi-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "akashi-core",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi_api"]

[tool.uv.sources]
akashi-core = { workspace = true }
