[project]
name = "akashi-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "akashi-cite",
    "akashi-code",
    "akashi-core",
    "akashi-now",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
akashi-schemas = "akashi_api.schemas:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi_api"]

[tool.uv.sources]
akashi-core = { workspace = true }
akashi-cite = { workspace = true }
akashi-code = { workspace = true }
akashi-now = { workspace = true }
