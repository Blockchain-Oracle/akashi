[project]
name = "akashi-nli"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "akashi-core",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi_nli"]

[tool.uv.sources]
akashi-core = { workspace = true }
