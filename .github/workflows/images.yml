name: images
# web + docs → ghcr.io/blockchain-oracle/akashi-{web,docs} (deploy-runbook.md "GHCR workflow"; one shared Dockerfile)
on:
  push:
    branches: [main]
    paths: ["apps/**", "cards/**", "packages/api-client/**", "packages/brand/**", "packages/model/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", "deploy/next-app/**", ".github/workflows/images.yml"]
  workflow_dispatch:
permissions: { contents: read, packages: write }
concurrency: { group: images, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy: { matrix: { app: [web, docs] } }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/blockchain-oracle/akashi-${{ matrix.app }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/next-app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DOCS_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
